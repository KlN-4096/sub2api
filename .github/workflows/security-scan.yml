name: Security Scan

on:
  push:
    # 同 backend-ci.yml：main 是 cron 宿主（每天被重建成上游代码），tag push
    # 与推分支那次扫的是同一棵树。周一的 schedule 不受这里影响，照常跑。
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          # schedule 只能从默认分支触发，而默认分支 main 是 sync-upstream 的 cron
          # 宿主，内容是 upstream/main —— 扫它等于扫上游的依赖。klno 的 go.mod 已
          # 经分叉（klno.4 把 grpc 提到 v1.83.2），周扫必须显式指向 klno。
          # 留空 = actions/checkout 的默认行为，push / pull_request 不受影响。
          ref: ${{ github.event_name == 'schedule' && 'klno' || '' }}
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'klno' || '' }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
      - name: Check audit exceptions
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
