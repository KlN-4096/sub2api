name: Sync upstream into klno

# 上游 Wei-Shaw/sub2api 发新版标签后，把 klno 分支 rebase 到新标签、跑定向测试、
# 打 <上游标签>-klno.N 标签并触发 release.yml 出包；同时检查 codex-rs 身份相关源码是否变动。
# 冲突、测试失败、codex-rs 漂移都只让 run 失败（GitHub 邮件通知），不推送任何东西；fork 未开 issues。
# 所以漂移检查必须排在推分支/推标签/触发 release 之前——排在后面等于包已经发出去才报错。
# 每次运行还会把默认分支 main 重建成 upstream/main + 本文件：GitHub 的定时 workflow 只从默认
# 分支触发，main 只是 cron 的宿主，没人同步它就会一直落后（仓库首页那条 "N commits behind"）。
# GITHUB_TOKEN 没有 workflows 权限：上游这段提交改过 .github/workflows 时推不动 main，只告警，
# 要用有 workflow 权限的凭据在本地重做该步。同理，改了本文件也要手动推到 main——cron 跑的是 main 那份。

on:
  schedule:
    - cron: '17 3 * * *' # UTC，每天一次
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '指定上游标签（留空=最新 vX.Y.Z）'
        required: false
        type: string

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: Wei-Shaw/sub2api
  FORK_BRANCH: klno
  # 已人工核对过身份恒等式的 codex 版本（正式版标签或完整提交号）；漂移检查拿它和最新正式版比（不比 main，见该步注释）
  CODEX_PINNED_REF: e7637306bc9246a3e42e407cb94f96b7ed345e3e
  CODEX_IDENTITY_PATHS: >-
    codex-rs/codex-api/src/requests/headers.rs
    codex-rs/codex-api/src/endpoint/responses.rs
    codex-rs/core/src/responses_metadata.rs
    codex-rs/core/src/client.rs
    codex-rs/core/src/session/session.rs
    codex-rs/core/src/state/auto_compact_window.rs

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream tag
        id: up
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --tags --force upstream
          if [ -n "${{ inputs.upstream_tag }}" ]; then
            latest="${{ inputs.upstream_tag }}"
          else
            latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n 1p) # 不用 head：pipefail 下会 SIGPIPE
          fi
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${FORK_BRANCH}" | sed -E 's/-klno\.[0-9]+$//')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "upstream latest=$latest, klno base=$base"

      - name: Rebase klno onto upstream tag
        id: rebase
        if: steps.up.outputs.latest != steps.up.outputs.base
        run: |
          set -euo pipefail
          git config user.name "klno-sync-bot"
          git config user.email "klno-sync-bot@users.noreply.github.com"
          if git rebase --onto "${{ steps.up.outputs.latest }}" "${{ steps.up.outputs.base }}" "${FORK_BRANCH}"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on conflict
        if: steps.rebase.outputs.conflict == 'true'
        run: |
          echo "::error title=sync-upstream conflict::rebase klno (${{ steps.up.outputs.base }}) onto ${{ steps.up.outputs.latest }} 冲突，需要人工处理，冲突文件见本步骤日志"
          cat /tmp/conflicts.txt
          exit 1

      - name: Setup Go
        if: steps.up.outputs.latest != steps.up.outputs.base
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build and targeted tests
        if: steps.up.outputs.latest != steps.up.outputs.base
        working-directory: backend
        run: |
          set -euo pipefail
          go build ./...
          go test -tags=unit ./internal/service -count=1 -run 'CodexFingerprintConvergence|CodexAccountIdentity|CodexFingerprint|CodexDeviceWireProfile|OAuthPassthrough|BuildOpenAIWSHeaders|SetupTokenCompat|IngressSession|CPR|OAuthOnlyGroupPredicate' 2>&1 | grep -vE '"level":"(DEBUG|INFO|WARN)"' | tail -20

      - name: Check codex-rs identity sources for drift
        # 比最新正式版而不是 main：网关冒充的是用户在跑的发行版，main 上天天在改（client.rs 两周近千行），
        # 比 main 会天天红、真正的发版漂移反而淹没在噪音里。
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none https://github.com/openai/codex.git /tmp/codex
          cd /tmp/codex
          latest=$(git tag -l 'rust-v*' --sort=-v:refname | grep -E '^rust-v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n 1p)
          if ! git diff --quiet "${CODEX_PINNED_REF}" "${latest}" -- ${CODEX_IDENTITY_PATHS}; then
            git diff --stat "${CODEX_PINNED_REF}" "${latest}" -- ${CODEX_IDENTITY_PATHS}
            echo "::error title=codex-rs identity drift::codex 正式版 ${latest} 的身份文件相对 ${CODEX_PINNED_REF} 有变动，请核对 openai_codex_fingerprint_convergence.go 的恒等式，确认后更新 CODEX_PINNED_REF（并手动推到 main）。"
            exit 1
          fi
          echo "codex identity sources unchanged between ${CODEX_PINNED_REF} and ${latest}"

      - name: Push rebased branch and tag, trigger release
        if: steps.up.outputs.latest != steps.up.outputs.base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push --force-with-lease origin "${FORK_BRANCH}"
          n=1
          while git ls-remote --exit-code --tags origin "refs/tags/${{ steps.up.outputs.latest }}-klno.${n}" >/dev/null 2>&1; do n=$((n+1)); done
          tag="${{ steps.up.outputs.latest }}-klno.${n}"
          git tag -a "$tag" -m "klno build on upstream ${{ steps.up.outputs.latest }}"
          git push origin "$tag"
          # GITHUB_TOKEN 推的 tag 不会触发 release.yml，改用 workflow_dispatch；必须显式 --repo，否则 gh 会从 upstream remote 解析成上游仓库（403）
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "$tag" -f tag="$tag"
          echo "released $tag"

      - name: Resync default branch onto upstream
        # 前面的 drift 告警红了也要跑：main 只是 cron 宿主，同步它不该被告警牵连
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git fetch --force origin main
          git fetch --force upstream main
          behind=$(git rev-list --count origin/main..upstream/main)
          if [ "$behind" -eq 0 ]; then
            echo "default branch already level with upstream/main"
            exit 0
          fi
          # main 只承担一个职责：给 cron 当宿主。重建成 upstream/main + klno 那份本文件，
          # 不保留 release.yml 推来的 "chore: sync VERSION to *-klno.*"——那是 klno 的版本号，
          # 留在镜像分支上只会每次跟上游的 VERSION 打架。
          git config user.name "klno-sync-bot"
          git config user.email "klno-sync-bot@users.noreply.github.com"
          git checkout -B main upstream/main
          git checkout "${FORK_BRANCH}" -- .github/workflows/sync-upstream.yml
          git commit -q -m "ci: host sync-upstream workflow on the default branch" || true
          test -f .github/workflows/sync-upstream.yml # 丢了这个文件 cron 就停了
          if ! out=$(git push --force-with-lease origin main 2>&1); then
            echo "$out"
            if grep -q 'without .workflows. permission' <<<"$out"; then
              echo "::warning title=main 未同步::上游这段提交改过 .github/workflows，GITHUB_TOKEN 没有 workflows 权限推不动；用有 workflow 权限的凭据在本地重做本步即可。main 只是 cron 宿主，落后不影响 klno 同步。"
              exit 0
            fi
            exit 1
          fi
          echo "$out"
          echo "default branch resynced onto upstream/main ($(git rev-parse --short upstream/main)), was $behind behind"
